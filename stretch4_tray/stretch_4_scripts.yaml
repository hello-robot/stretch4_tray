  separator_after: false
  category: ros2
  visible_in_tray: false
- key: stretch_driver
  icon: ''
  name: 'stretch_driver: Launch'
  command: ros2 launch stretch_core stretch_driver.launch.py broadcast_odom_tf:=True
  open_terminal: true
  description: Launch the ROS2 stretch_driver launch file.
  separator_after: false
  category: ros2_launch
  visible_in_tray: false
- key: head_cameras
  icon: ''
  name: 'Cameras: Launch'
  command: ros2 launch stretch_core luxonis.launch.py use_center:=true
  open_terminal: true
  description: Launch the ROS2 head cameras launch file.
  separator_after: false
  category: ros2_launch
  visible_in_tray: false
- key: nav2_offline_map
  icon: ''
  name: 'nav2: Offline Map'
  command: ros2 launch stretch_nav2 offline_mapping_hesai.launch.py use_rviz:=true
  open_terminal: true
  description: Launch the offline mapping ROS2 launch file.
  separator_after: false
  category: ros2_nav2
  visible_in_tray: false
- key: nav2_save_map
  icon: ''
  name: 'nav2: Save Map'
  command: ros2 run nav2_map_server map_saver_cli -f ${HELLO_FLEET_PATH}/maps/stretch_map
  open_terminal: true
  description: Save the current map. This will save it as 'stretch_map.yaml' in the
    maps stretch_user directory.
  separator_after: false
  category: ros2_nav2
  visible_in_tray: false
- key: nav2_run_map
  icon: ''
  name: 'nav2: Run stretch_map.yaml Map'
  command: ros2 launch stretch_nav2 navigation_mppi_hesai.launch.py map:=${HELLO_FLEET_PATH}/maps/stretch_map.yaml
    use_rviz:=true
  open_terminal: true
  description: Run nav2 with the stretch_map.yaml file.
  separator_after: false
  category: ros2_nav2
  visible_in_tray: false
